# DIAN - proxy inverso con HTTPS. Se instala como /etc/nginx/conf.d/dian.conf; no toca ningún otro sitio de nginx.
#
#   443   dian.sistemas360.com: API pública (/api/ y /salud, Pos.Api en 127.0.0.1:5290) y portal de clientes (todo lo
#         demás, Admin.Web en 127.0.0.1:5280). La API la controla la clave de cada cliente; el portal, el usuario y
#         contraseña de cada cliente. Las cuentas de OPERADOR no pueden entrar por aquí (ver X-Dian-Entrada).
#   443   (cualquier otro nombre o la IP) solo la API, como antes.
#   8443  App Admin (127.0.0.1:5280) para el operador, SOLO desde redes internas y la VPN: cualquier otra dirección
#         recibe 403.
#   80    dian.sistemas360.com: solo el desafío de Let's Encrypt y una redirección a HTTPS.
#
# X-Dian-Entrada: nginx la fija SIEMPRE ("publica" o "interna") y descarta la que mande el cliente. La app solo escucha en
# 127.0.0.1, por eso solo nginx puede ponerla. Con "publica" la app no deja entrar a un operador (Portal:OperadorSoloInterno).
#
# El certificado es el de /etc/dian/tls. El script de instalación crea uno autofirmado si no existe: sirve para pruebas;
# para el dominio público se emite con: dian-tls letsencrypt dian.sistemas360.com <correo>

limit_req_zone $binary_remote_addr zone=dian_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=dian_admin:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=dian_portal:10m rate=10r/s;

# --- Dominio público: portal de clientes y API ---
server {
    listen 80;
    server_name dian.sistemas360.com;

    # El desafío HTTP-01 de Let's Encrypt (lo escribe certbot en esta carpeta).
    location /.well-known/acme-challenge/ {
        root /var/www/dian-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dian.sistemas360.com;

    ssl_certificate     /etc/dian/tls/dian.crt;
    ssl_certificate_key /etc/dian/tls/dian.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dian_ssl:5m;

    server_tokens off;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API de facturación (la que usan los ERP).
    location ~ ^/(api/|salud$) {
        limit_req zone=dian_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Portal de clientes.
    location / {
        client_max_body_size 3m;
        limit_req zone=dian_portal burst=20 nodelay;
        proxy_pass http://127.0.0.1:5280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dian-Entrada publica;
    }
}

# --- Sitio por IP u otros nombres: solo la API, como antes ---

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/dian/tls/dian.crt;
    ssl_certificate_key /etc/dian/tls/dian.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dian_ssl:5m;

    server_tokens off;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;

    location / {
        limit_req zone=dian_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El envío a la DIAN puede tardar (en habilitación, el set de pruebas espera su resultado).
        proxy_read_timeout 180s;
    }
}

# --- Entrada desde el IIS del host (reverse proxy): API y portal de clientes por un puerto HTTP interno ---
# El IIS (172.31.50.1) termina el HTTPS con el certificado comodín y reenvía aquí, igual que con QuantyERP (8080/8081).
# Solo el host puede llegar a este puerto (ufw). Por ser tráfico de internet, el portal lo marca "publica": el operador no entra.
server {
    listen 8090;
    server_name _;

    server_tokens off;
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # La IP real del cliente la manda el IIS en X-Forwarded-For; solo se le cree al host.
    set_real_ip_from 172.31.50.1;
    real_ip_header X-Forwarded-For;

    location ~ ^/(api/|salud$) {
        limit_req zone=dian_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:5290;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }

    location / {
        client_max_body_size 3m;
        limit_req zone=dian_portal burst=20 nodelay;
        proxy_pass http://127.0.0.1:5280;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # El IIS reenvía con el nombre interno de la VM; la app arma sus redirecciones con el host que ve, así que se le
        # dice cuál es la dirección pública. Si cambia (p. ej. a dian.sistemas360.com sin puerto), cambiar esta línea.
        proxy_set_header X-Forwarded-Host services.sistemas360.com:47125;
        proxy_set_header X-Dian-Entrada publica;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/dian/tls/dian.crt;
    ssl_certificate_key /etc/dian/tls/dian.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:dian_ssl:5m;

    server_tokens off;
    client_max_body_size 3m;

    # Redes permitidas: este equipo, redes privadas y la VPN (26.0.0.0/8). Ajústelas a su red.
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 26.0.0.0/8;
    deny all;

    location / {
        limit_req zone=dian_admin burst=20 nodelay;
        proxy_pass http://127.0.0.1:5280;
        proxy_http_version 1.1;
        # $http_host conserva el puerto (8443, o el del túnel SSH); con $host la app mandaba a "localhost/Login" sin puerto.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Dian-Entrada interna;
    }
}
